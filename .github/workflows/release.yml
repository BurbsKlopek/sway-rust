name: Build & Publish Android TV APK Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android

      - name: Locate Android NDK
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -n 1)
          echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build Rust native libraries (armeabi-v7a + arm64-v8a)
        run: |
          cd rust
          CC_armv7_linux_androideabi=armv7a-linux-androideabi26-clang \
          AR_armv7_linux_androideabi=llvm-ar \
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=armv7a-linux-androideabi26-clang \
          cargo build --release --target armv7-linux-androideabi

          CC_aarch64_linux_android=aarch64-linux-android26-clang \
          AR_aarch64_linux_android=llvm-ar \
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android26-clang \
          cargo build --release --target aarch64-linux-android

          mkdir -p ../android/app/src/main/jniLibs/armeabi-v7a ../android/app/src/main/jniLibs/arm64-v8a
          cp target/armv7-linux-androideabi/release/libsway_rust.so ../android/app/src/main/jniLibs/armeabi-v7a/
          cp target/aarch64-linux-android/release/libsway_rust.so ../android/app/src/main/jniLibs/arm64-v8a/

      - name: Assemble Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../Sway-Rust-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Sway-Rust-${{ github.ref_name }}.apk
          generate_release_notes: true
