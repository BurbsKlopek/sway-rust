[package]
name = "sway_rust"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
chrono = "0.4"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
jni = "0.21"
log = "0.4"
ndk-context = "0.1"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
egui_glow = { path = "vendor/egui_glow" }
egui-winit = { path = "vendor/egui-winit" }
